name: Bootstrap iPlate source

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/iplate.zip.b64
          base64 --decode /tmp/iplate.zip.b64 > /tmp/iplate.zip
          unzip -qo /tmp/iplate.zip -d .
          chmod +x android/gradlew
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import sanitized iPlate project"
          git push
