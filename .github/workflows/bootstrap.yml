name: Bootstrap iPlate source

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recover and extract sanitized source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/iplate.zip.b64
          base64 --decode /tmp/iplate.zip.b64 > /tmp/iplate.partial.zip
          python3 - <<'PY'
          import os, struct, zlib
          from pathlib import Path

          data = Path('/tmp/iplate.partial.zip').read_bytes()
          pos = 0
          recovered = 0
          while pos + 30 <= len(data):
              sig = struct.unpack_from('<I', data, pos)[0]
              if sig != 0x04034B50:
                  break
              (_sig, ver, flags, method, mtime, mdate, crc, csize, usize, nlen, xlen) = struct.unpack_from('<IHHHHHIIIHH', data, pos)
              if flags & 0x08:
                  raise RuntimeError(f'ZIP entry at {pos} uses a data descriptor; cannot recover safely')
              start = pos + 30
              name_b = data[start:start+nlen]
              name = name_b.decode('utf-8', errors='surrogateescape')
              payload_start = start + nlen + xlen
              payload_end = payload_start + csize
              if payload_end > len(data):
                  raise RuntimeError(f'Truncated file data for {name}')
              payload = data[payload_start:payload_end]
              if method == 0:
                  raw = payload
              elif method == 8:
                  raw = zlib.decompress(payload, -15)
              else:
                  raise RuntimeError(f'Unsupported compression method {method} for {name}')
              if len(raw) != usize:
                  raise RuntimeError(f'Unexpected size for {name}')
              safe = Path(name)
              if safe.is_absolute() or '..' in safe.parts:
                  raise RuntimeError(f'Unsafe path in archive: {name}')
              if name.endswith('/'):
                  safe.mkdir(parents=True, exist_ok=True)
              else:
                  safe.parent.mkdir(parents=True, exist_ok=True)
                  safe.write_bytes(raw)
                  recovered += 1
              pos = payload_end
          print(f'Recovered {recovered} files from local ZIP entries; stopped at byte {pos} of {len(data)}')
          if recovered < 20:
              raise RuntimeError('Too few files recovered; refusing to publish')
          PY
          test -f android/app/src/main/java/com/iplate/app/MainActivity.kt
          test -f backend/index.php
          test -f backend/db.php
          test -f backend/database/iplate.sql
          chmod +x android/gradlew
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import sanitized iPlate project"
          git push
