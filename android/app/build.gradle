plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionPropsFile = file("$projectDir/version.properties")
def versionProps = new Properties()
if (!versionPropsFile.exists()) {
    versionPropsFile.text = "BUILD_NUMBER=0\n"
}
versionPropsFile.withInputStream { versionProps.load(it) }

def currentBuildNumber = (versionProps.getProperty("BUILD_NUMBER", "0") as int)
def isBuildInvocation = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains("assemble") || normalized.contains("bundle") || normalized.contains("install")
}
if (isBuildInvocation) {
    currentBuildNumber += 1
    versionProps.setProperty("BUILD_NUMBER", currentBuildNumber.toString())
    versionPropsFile.withOutputStream { versionProps.store(it, null) }
}

android {
    namespace 'com.iplate.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.iplate.app'
        minSdk 24
        targetSdk 34
        versionCode currentBuildNumber
        versionName "v${currentBuildNumber}"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
